<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyChat - Free Video Calls</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #101827;
    color: white;
    min-height: 100vh;
}

header {
    background: #1d2939;
    padding: 20px;
    text-align: center;
    border-bottom: 1px solid #344054;
}

header h1 {
    color: #38bdf8;
}

.container {
    max-width: 900px;
    margin: 40px auto;
    padding: 20px;
}

.card {
    background: #1d2939;
    padding: 30px;
    border-radius: 15px;
    text-align: center;
}

.card h2 {
    margin-bottom: 15px;
}

.card p {
    color: #98a2b3;
    margin-bottom: 20px;
}

input {
    width: 100%;
    padding: 15px;
    border-radius: 8px;
    border: none;
    margin-bottom: 15px;
    font-size: 16px;
}

button {
    padding: 14px 25px;
    border: none;
    border-radius: 8px;
    background: #38bdf8;
    color: #101827;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    margin: 5px;
}

button:hover {
    background: #0ea5e9;
}

.end-btn {
    background: #ef4444;
    color: white;
}

#meeting {
    width: 100%;
    height: 600px;
    margin-top: 20px;
    border-radius: 12px;
    overflow: hidden;
    display: none;
}

#callControls {
    display: none;
    text-align: center;
    margin-top: 15px;
}

@media(max-width: 600px) {
    #meeting {
        height: 75vh;
    }

    .container {
        margin: 10px auto;
    }
}
</style>
</head>

<body>

<header>
    <h1>💬 MyChat</h1>
    <p>Free Voice & Video Calls</p>
</header>

<div class="container">

    <div class="card" id="joinCard">
        <h2>📞 Start or Join a Call</h2>
        <p>Enter a room name to connect with friends.</p>

        <input
            type="text"
            id="username"
            placeholder="Your name"
        >

        <input
            type="text"
            id="roomName"
            placeholder="Room name (example: friends123)"
        >

        <button onclick="startCall()">
            📹 Start Video Call
        </button>

        <button onclick="startAudioCall()">
            🎤 Voice Call
        </button>
    </div>

    <div id="meeting"></div>

    <div id="callControls">
        <button onclick="copyLink()">
            🔗 Copy Invite Link
        </button>

        <button class="end-btn" onclick="endCall()">
            ❌ End Call
        </button>
    </div>

</div>

<script src="https://meet.jit.si/external_api.js"></script>

<script>
let api;
let currentRoom = "";

const params = new URLSearchParams(window.location.search);

if (params.has("room")) {
    document.getElementById("roomName").value =
        params.get("room");
}

function startCall() {
    createMeeting(false);
}

function startAudioCall() {
    createMeeting(true);
}

function createMeeting(audioOnly) {

    const username =
        document.getElementById("username").value.trim();

    const room =
        document.getElementById("roomName").value.trim();

    if (!username || !room) {
        alert("Please enter your name and room name.");
        return;
    }

    if (!/^[a-zA-Z0-9_-]+$/.test(room)) {
        alert("Room names can only contain letters, numbers, _ and -.");
        return;
    }

    currentRoom = room;

    document.getElementById("joinCard").style.display = "none";
    document.getElementById("meeting").style.display = "block";
    document.getElementById("callControls").style.display = "block";

    const options = {
        roomName: currentRoom,

        width: "100%",
        height: "100%",

        parentNode: document.querySelector("#meeting"),

        userInfo: {
            displayName: username
        },

        configOverwrite: {
            startWithAudioMuted: false,
            startWithVideoMuted: audioOnly,
            prejoinPageEnabled: false
        },

        interfaceConfigOverwrite: {
            SHOW_JITSI_WATERMARK: false
        }
    };

    api = new JitsiMeetExternalAPI("meet.jit.si", options);

    if (audioOnly) {
        api.addEventListener("videoConferenceJoined", () => {
            api.executeCommand("toggleVideo");
        });
    }

    api.addEventListener("readyToClose", endCall);
}

function copyLink() {

    const link =
        window.location.origin +
        window.location.pathname +
        "?room=" +
        encodeURIComponent(currentRoom);

    navigator.clipboard.writeText(link)
        .then(() => alert("Invite link copied!"))
        .catch(() => prompt("Copy this invite link:", link));
}

function endCall() {

    if (api) {
        api.dispose();
        api = null;
    }

    document.getElementById("meeting").style.display = "none";
    document.getElementById("meeting").innerHTML = "";

    document.getElementById("callControls").style.display = "none";
    document.getElementById("joinCard").style.display = "block";
}
</script>

</body>
</html>
